<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <header class="header">

    </header>
    <section class="searching">
    <div class="container">
        <h2 class="searching__title title">Яка наступная точка призначення?</h2>
        <p class="searching__subtitle">У який куточок світу ти хочеш вирушити? Шукай серед понад 200 доступних напрямків.
        </p>
        <div class="searching__wrapper">
            <form action="" class="searching__form">
                <h3 class="searching__form-title">Обери, куди вирушити:</h3>
                <input type="text" class='searching__form-input' placeholder="Уся Африка">
                <input type="text" class='searching__form-input' placeholder="Резорт">
                <input type="text" class='searching__form-input' placeholder="Усі рівні">
                <button type="submit" class="searching__form-btn">Шукати</button>
            </form>
            <ul class="searching__selection">
                <li class="searching__selection-item">Напрямок<button type="button" class="searching__selection-btn">></button></li>
                <li class="searching__selection-item">Тип відпочинку<button type="button" class="searching__selection-btn">></button></li>
                <li class="searching__selection-item">Рівень серфінгу<button type="button" class="searching__selection-btn">></button></li>
                <li class="searching__selection-item">Проживання<button type="button" class="searching__selection-btn">></button></li>
                <li class="searching__selection-item">Додаткові заходи крім серфінгу<button type="button" class="searching__selection-btn">></button></li>
            </ul>
        </div>
        <ul class="searching__list"></ul>
    </div>
</section>
    <script src="./js/index.js"></script>
</body>

</html>
